<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة العريس - عبدالله خليل</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:Cairo,sans-serif;background:radial-gradient(ellipse at top,#34271a 0,#17130f 55%);color:#f8f1e5;max-width:640px;margin:auto;padding:18px;min-height:100vh}
h1,h2{color:#d6b477;font-family:Amiri,serif;font-weight:400}
.card{background:#211b15;border:1px solid #6d5736;border-radius:14px;padding:18px;margin:12px 0}
input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #57452f;background:#17130f;color:#f8f1e5;width:100%;box-sizing:border-box;margin:6px 0}
button{background:linear-gradient(120deg,#e5c88e,#b28a4c);color:#21180d;font-weight:700;border:0;cursor:pointer}
button.danger{background:#7a2020;color:#fff}
.ok{color:#4ade80;font-weight:700}
.bad{color:#f87171;font-weight:700}
.hidden{display:none!important}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;margin-top:10px}
.stat{background:#17130f;padding:14px;border-radius:10px;border:1px solid #4c3b26}
.stat b{display:block;font-size:26px;color:#d6b477;margin-bottom:4px}
.stat span{font-size:12px;color:#c2b6a4}
#reader{width:100%;border-radius:12px;overflow:hidden;margin:12px 0;background:#000}
#scanResult{padding:12px;border-radius:8px;margin-top:10px;text-align:center;font-weight:700}
#scanResult.success{background:#0d3b22;color:#4ade80}
#scanResult.error{background:#3b0d0d;color:#f87171}
#loginMsg{color:#f87171;text-align:center}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.header h1{font-size:22px;margin:0}
.header button{width:auto;padding:8px 14px;margin:0}
</style>
</head>
<body>

<div id="loginView" class="card">
  <h1 style="text-align:center">🔐 دخول العريس</h1>
  <p style="color:#c2b6a4;font-size:13px;text-align:center">عبدالله خليل - لوحة التحكم</p>
  <input id="email" type="email" placeholder="البريد الإلكتروني" value="lq_dk@wedding.local" autocomplete="username">
  <input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password">
  <button onclick="doLogin()">تسجيل الدخول</button>
  <p id="loginMsg"></p>
</div>

<div id="adminView" class="hidden">
  <div class="header">
    <h1>👑 لوحة العريس</h1>
    <button class="danger" onclick="doLogout()">خروج</button>
  </div>

  <div class="card">
    <h2 style="margin-top:0">📊 إحصائيات الحفل</h2>
    <div class="stats">
      <div class="stat"><b id="totalTickets">0</b><span>تذاكر صادرة</span></div>
      <div class="stat"><b id="expectedGuests">0</b><span>حضور متوقع</span></div>
      <div class="stat"><b id="checkedIn">0</b><span>تم دخولهم</span></div>
      <div class="stat"><b id="remaining">0</b><span>لم يصلوا</span></div>
    </div>
    <button style="margin-top:12px" onclick="loadStats()">🔄 تحديث</button>
  </div>

  <div class="card">
    <h2 style="margin-top:0">📷 فحص تذكرة</h2>
    <div id="reader"></div>
    <button id="startScanBtn" onclick="startScanner()">▶️ تشغيل الكاميرا</button>
    <button id="stopScanBtn" class="danger hidden" onclick="stopScanner()">⏹️ إيقاف الكاميرا</button>
    <input id="manualTicket" placeholder="أو أدخل رقم التذكرة يدوياً (WED-XXXX)">
    <button onclick="checkManual()">فحص يدوي</button>
    <div id="scanResult" class="hidden"></div>
  </div>

  <div class="card">
    <h2 style="margin-top:0">📋 آخر الفحوصات</h2>
    <div id="recentList" style="font-size:13px;line-height:2;color:#c2b6a4">لا يوجد سجل بعد</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, runTransaction }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { Html5Qrcode } from "https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js";

const firebaseConfig = {
  apiKey: "AIzaSyDmFiV2mSHIPcBD0Bgdaxrpjz_8fP8v90c",
  authDomain: "wedding-invitation-2027.firebaseapp.com",
  projectId: "wedding-invitation-2027",
  storageBucket: "wedding-invitation-2027.firebasestorage.app",
  messagingSenderId: "603770101625",
  appId: "1:603770101625:web:e32be2997d4c69483819a8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let scanner = null;
let scanning = false;
const recentLog = [];

window.doLogin = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const msg = document.getElementById("loginMsg");
  msg.textContent = "جاري التحقق...";
  try {
    await signInWithEmailAndPassword(auth, email, password);
    msg.textContent = "";
  } catch (e) {
    msg.textContent = "❌ فشل الدخول: " + (e.code === "auth/invalid-credential" ? "بيانات خاطئة" : e.message);
  }
};

window.doLogout = async () => {
  await stopScanner();
  await signOut(auth);
};

onAuthStateChanged(auth, user => {
  document.getElementById("loginView").classList.toggle("hidden", !!user);
  document.getElementById("adminView").classList.toggle("hidden", !user);
  if (user) loadStats();
});

window.loadStats = async () => {
  try {
    const snap = await getDocs(collection(db, "tickets"));
    let total = 0, expected = 0, checked = 0;
    snap.forEach(d => {
      const t = d.data();
      total++;
      expected += 1 + (Number(t.companions) || 0);
      if (t.used) checked++;
    });
    document.getElementById("totalTickets").textContent = total;
    document.getElementById("expectedGuests").textContent = expected;
    document.getElementById("checkedIn").textContent = checked;
    document.getElementById("remaining").textContent = total - checked;
  } catch (e) {
    console.error(e);
  }
};

async function verifyTicket(ticketId) {
  const ref = doc(db, "tickets", ticketId);
  try {
    const result = await runTransaction(db, async (tx) => {
      const snap = await tx.get(ref);
      if (!snap.exists()) throw new Error("تذكرة غير موجودة");
      const data = snap.data();
      if (data.used) {
        const usedAt = data.usedAt?.toDate ? data.usedAt.toDate().toLocaleString('ar-IQ') : "سابقاً";
        throw new Error(`مستخدمة سابقاً — ${usedAt}`);
      }
      tx.update(ref, { used: true, usedAt: new Date() });
      return data;
    });
    return { ok: true, data: result };
  } catch (e) {
    return { ok: false, error: e.message || e.toString() };
  }
}

function showResult(ok, text) {
  const el = document.getElementById("scanResult");
  el.classList.remove("hidden", "success", "error");
  el.classList.add(ok ? "success" : "error");
  el.textContent = text;
  recentLog.unshift({ ok, text, time: new Date().toLocaleTimeString('ar-IQ') });
  if (recentLog.length > 10) recentLog.pop();
  document.getElementById("recentList").innerHTML = recentLog
    .map(r => `<div style="border-bottom:1px solid #4c3b26;padding:6px 0">
      <span class="${r.ok?'ok':'bad'}">${r.ok?'✅':'❌'}</span> ${r.text}
      <span style="float:left;color:#8d806e;font-size:11px">${r.time}</span>
    </div>`).join("");
}

async function processTicketId(ticketId) {
  ticketId = ticketId.trim().toUpperCase();
  if (!ticketId) return;
  const r = await verifyTicket(ticketId);
  if (r.ok) {
    showResult(true, `صالح ✓ — ${r.data.guestName} (+${r.data.companions} مرافقين)`);
  } else {
    showResult(false, r.error);
  }
  loadStats();
}

window.checkManual = () => {
  const id = document.getElementById("manualTicket").value;
  processTicketId(id);
};

window.startScanner = async () => {
  if (scanning) return;
  try {
    scanner = new Html5Qrcode("reader");
    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      async (decodedText) => {
        if (scanning === "processing") return;
        scanning = "processing";
        try {
          const parsed = JSON.parse(decodedText);
          await processTicketId(parsed.ticket);
        } catch {
          showResult(false, "QR غير صالح");
        }
        setTimeout(() => { scanning = true; }, 2000);
      },
      () => {}
    );
    scanning = true;
    document.getElementById("startScanBtn").classList.add("hidden");
    document.getElementById("stopScanBtn").classList.remove("hidden");
  } catch (e) {
    showResult(false, "فشل تشغيل الكاميرا: " + e.message);
  }
};

window.stopScanner = async () => {
  if (scanner && scanning) {
    try { await scanner.stop(); await scanner.clear(); } catch {}
    scanner = null;
    scanning = false;
    document.getElementById("startScanBtn").classList.remove("hidden");
    document.getElementById("stopScanBtn").classList.add("hidden");
  }
};
</script>
</body>
</html>
